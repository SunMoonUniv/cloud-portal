{{define "content"}}
<section class="card narrow">
  <h1>승인 대기</h1>
  <div hx-ext="sse" sse-connect="/pending/events" sse-swap="status" sse-close="status">
    <p><strong>{{.User.Name}}</strong>({{.User.Login}})님의 가입 신청을 운영진이 확인하고 있다.</p>
    <p class="muted">승인되면 이 화면이 저절로 바뀐다. 창을 닫았다가 나중에 다시 로그인해도 된다.</p>
  </div>
</section>
{{end}}

{{define "decided"}}
{{- if eq .Status "active"}}
<p class="flash ok">승인됐다.</p>
<p><a class="button" href="/me">계속</a></p>
{{- else}}
<p class="flash err">가입 신청이 {{status .Status}} 처리됐다. 운영진에게 문의한다.</p>
{{- end}}
{{end}}
