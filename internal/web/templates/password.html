{{define "content"}}
<section class="card narrow">
  <h1>비밀번호 바꾸기</h1>
  {{- if eq .User.MustChangePassword 1}}
  <p class="flash err">임시 비밀번호로 로그인했다. 새 비밀번호를 정해야 계속할 수 있다.</p>
  {{- end}}
  <form method="post" action="/me/password">
    <input type="hidden" name="csrf" value="{{.CSRF}}">
    <label>지금 비밀번호<input name="current" type="password" autocomplete="current-password" required autofocus></label>
    <label>새 비밀번호(8자 이상)<input name="password" type="password" minlength="8" maxlength="128" autocomplete="new-password" required></label>
    <label>새 비밀번호 다시<input name="password2" type="password" minlength="8" maxlength="128" autocomplete="new-password" required></label>
    <button type="submit">바꾸기</button>
  </form>
  {{- if eq .User.Role "student"}}
  <p class="muted">웹 콘솔 비밀번호도 같은 값으로 바뀐다. 학교 비밀번호는 쓰지 않는다(HTTP).</p>
  {{- end}}
</section>
{{end}}
